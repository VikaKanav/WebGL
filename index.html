<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


<title>PA#1</title>
<style>
    body {
        background-color: #EEEEEE;
    }
</style>

<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>
<script src="./shader.gpu"></script>
<script src="./Model.js"></script>
<script src="./main.js"></script>

</head>
<body onload="init()">

<h2>A Cube with "Trackball" Mouse Rotation</h2>

<p id="message">Drag your mouse on the cube to rotate it.<br>
(On a touch screen, you can use your finger.)</p>


<div id="canvas-holder">
   <canvas width="600" height="600" id="webglcanvas" style="background-color:red"></canvas>
</div>

<div style="color: white; font-family: sans-serif; margin-bottom: 10px;">
    <label>U Гранулярність (Steps): 
        <input type="range" id="uSlider" min="10" max="100" value="40" oninput="updateSurface()">
    </label>
    <span id="uVal">40</span><br>
    
    <label>V Гранулярність (Steps): 
        <input type="range" id="vSlider" min="10" max="100" value="40" oninput="updateSurface()">
    </label>
    <span id="vVal">40</span>
</div>


</body></html>
